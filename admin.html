<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anatovia Admin</title>
<style>
:root{--bg:#0b102e;--card:#141b45;--line:#2a3470;--ink:#eef1ff;--mut:#9aa6d6;--acc:#5eead4;--bad:#ff7b8a;--good:#7be495}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding:16px;max-width:980px;margin-inline:auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
button,select,input{font:inherit;color:inherit;background:#1d2660;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button{cursor:pointer;font-weight:700}button.p{background:var(--acc);color:#04201c;border:0}button.d{color:var(--bad)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#1d2660;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}th{color:var(--mut)}
.tw{overflow-x:auto}code,.code{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:embed}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:#1d2660}.tag.ok{color:var(--good)}.tag.no{color:var(--bad)}
textarea{width:100%;min-height:110px;background:#0b102e;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;direction:ltr}
#msg{margin:8px 0;min-height:22px}#msg.bad{color:var(--bad)}#msg.ok{color:var(--good)}
</style>
</head>
<body>
<h1>Anatovia — لوحة الإدارة</h1>
<div class="mut">لك أنت فقط. الحماية من قواعد Firebase، مش من إخفاء الصفحة.</div>
<div id="msg"></div>

<div id="login" class="card" hidden>
  <h2>تسجيل الدخول</h2>
  <button class="p" id="gbtn">دخول بحساب Google</button>
  <p class="mut">لازم تدخل بأحد الإيميلات المحددة في القواعد.</p>
</div>

<div id="app" hidden>
  <div class="row" style="justify-content:space-between"><div id="who" class="mut code"></div><div class="row"><button id="reload">🔄 تحديث</button><button id="out" class="d">خروج</button></div></div>

  <div class="card"><div class="stats" id="stats"></div></div>

  <div class="card">
    <h2>توليد أكواد جديدة</h2>
    <div class="row">
      <label>المدة <select id="days"><option value="30">شهر (30 يوم)</option><option value="90">3 شهور</option><option value="180">6 شهور</option><option value="365">سنة</option></select></label>
      <label>العدد <input id="count" type="number" min="1" max="100" value="5" style="width:80px"></label>
      <label>ملاحظة <input id="note" placeholder="اختياري: اسم المشتري" style="width:180px"></label>
      <button class="p" id="gen">ولّد</button>
    </div>
    <div id="newBox" hidden style="margin-top:10px">
      <div class="mut">الأكواد الجديدة (انسخها وابعتها):</div>
      <textarea id="newCodes" readonly></textarea>
      <button id="copy">📋 نسخ الكل</button>
    </div>
  </div>

  <div class="card">
    <h2>الأكواد</h2>
    <div class="row"><select id="cf"><option value="all">الكل</option><option value="unused">غير مستخدمة</option><option value="used">مستخدمة</option></select></div>
    <div class="tw"><table id="codes"></table></div>
  </div>

  <div class="card">
    <h2>المستخدمون</h2>
    <div class="tw"><table id="users"></table></div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
const ADMINS = ['ibrahim1162006@gmail.com', 'anaselbieli@gmail.com'];
const $ = (id) => document.getElementById(id);
const say = (m, k) => { $('msg').textContent = m || ''; $('msg').className = k || ''; };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (ts) => { if (!ts) return '—'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }); };
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore(), FV = firebase.firestore.FieldValue;
let users = [], codes = [];

$('gbtn').onclick = async () => { try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { say('فشل تسجيل الدخول: ' + (e.code || e.message), 'bad'); } };
$('out').onclick = () => auth.signOut();
$('reload').onclick = () => load();
auth.onAuthStateChanged((u) => {
  if (!u) { $('login').hidden = false; $('app').hidden = true; return; }
  if (!ADMINS.includes(u.email) || !u.emailVerified) { say('هذا الحساب (' + u.email + ') غير مسموح له.', 'bad'); auth.signOut(); return; }
  say(''); $('login').hidden = true; $('app').hidden = false; $('who').textContent = u.email; load();
});

async function load() {
  say('جارِ التحميل…');
  try {
    const [us, cs] = await Promise.all([db.collection('users').get(), db.collection('codes').orderBy('createdAt', 'desc').limit(500).get()]);
    users = us.docs.map((d) => ({ id: d.id, ...d.data() }));
    codes = cs.docs.map((d) => ({ id: d.id, ...d.data() }));
    draw(); say('');
  } catch (e) { say('خطأ في القراءة: ' + (e.code || e.message) + ' — تأكد أنك نشرت قواعد Firestore.', 'bad'); }
}

function draw() {
  const now = Date.now();
  const active = users.filter((u) => u.premiumUntil && u.premiumUntil.toMillis() > now).length;
  const used = codes.filter((c) => c.used).length;
  $('stats').innerHTML = [['المستخدمون', users.length], ['مشتركون نشطون', active], ['أكواد غير مستخدمة', codes.length - used], ['أكواد مستخدمة', used]].map(([a, b]) => `<div class="stat"><b>${b}</b>${a}</div>`).join('');
  const em = Object.fromEntries(users.map((u) => [u.id, u.email]));
  const f = $('cf').value;
  const list = codes.filter((c) => f === 'all' || (f === 'used') === !!c.used);
  $('codes').innerHTML = '<tr><th>الكود</th><th>المدة</th><th>الحالة</th><th>المستخدم</th><th>ملاحظة</th><th></th></tr>' + (list.map((c) =>
    `<tr><td class="code">${esc(c.id)}</td><td>${esc(c.days)} يوم</td><td><span class="tag ${c.used ? 'no' : 'ok'}">${c.used ? 'مستخدم ' + fmt(c.usedAt) : 'متاح'}</span></td><td class="code">${esc(em[c.usedBy] || c.usedBy || '')}</td><td>${esc(c.note || '')}</td><td>${c.used ? '' : `<button class="d" data-del="${esc(c.id)}">حذف</button>`}</td></tr>`).join('') || '<tr><td colspan="6" class="mut">لا يوجد</td></tr>');
  $('users').innerHTML = '<tr><th>الإيميل</th><th>الاشتراك</th><th>الأجهزة</th><th>سجّل</th><th></th></tr>' + (users.map((u) => {
    const on = u.premiumUntil && u.premiumUntil.toMillis() > now;
    return `<tr><td class="code">${esc(u.email)}</td><td><span class="tag ${on ? 'ok' : ''}">${on ? 'حتى ' + fmt(u.premiumUntil) : 'مجاني'}</span></td><td>${(u.devices || []).length}</td><td>${fmt(u.createdAt)}</td><td class="row"><button data-grant="${u.id}" data-d="30">+30 يوم</button><button data-reset="${u.id}">صفّر الأجهزة</button>${on ? `<button class="d" data-revoke="${u.id}">إلغاء</button>` : ''}</td></tr>`;
  }).join('') || '<tr><td colspan="5" class="mut">لا يوجد</td></tr>');
}
$('cf').onchange = draw;

const ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function rnd(n) { const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map((x) => ALPHA[x % ALPHA.length]).join(''); }
$('gen').onclick = async () => {
  const days = +$('days').value, n = Math.max(1, Math.min(100, +$('count').value || 1)), note = $('note').value.trim();
  const made = [], batch = db.batch();
  const taken = new Set(codes.map((c) => c.id));
  while (made.length < n) { const c = `ANAT-${rnd(4)}-${rnd(4)}`; if (taken.has(c)) continue; taken.add(c); made.push(c); batch.set(db.collection('codes').doc(c), { days, used: false, createdAt: FV.serverTimestamp(), note }); }
  try { await batch.commit(); $('newCodes').value = made.join('\n'); $('newBox').hidden = false; say(`تم توليد ${n} كود (${days} يوم)`, 'ok'); load(); }
  catch (e) { say('فشل التوليد: ' + (e.code || e.message), 'bad'); }
};
$('copy').onclick = async () => { try { await navigator.clipboard.writeText($('newCodes').value); say('تم النسخ', 'ok'); } catch (e) { $('newCodes').select(); say('اضغط Ctrl+C للنسخ'); } };

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.del) { if (!confirm('حذف الكود ' + b.dataset.del + '؟')) return; await db.collection('codes').doc(b.dataset.del).delete(); load(); }
    else if (b.dataset.grant) {
      const u = users.find((x) => x.id === b.dataset.grant), cur = u.premiumUntil ? u.premiumUntil.toMillis() : 0;
      await db.collection('users').doc(u.id).update({ premiumUntil: firebase.firestore.Timestamp.fromMillis(Math.max(cur, Date.now()) + 30 * 864e5) }); load();
    } else if (b.dataset.reset) { await db.collection('users').doc(b.dataset.reset).update({ devices: [] }); load(); }
    else if (b.dataset.revoke) { if (!confirm('إلغاء اشتراك هذا المستخدم؟')) return; await db.collection('users').doc(b.dataset.revoke).update({ premiumUntil: FV.delete() }); load(); }
  } catch (e) { say('فشل: ' + (e.code || e.message), 'bad'); }
});
</script>
</body>
</html>
